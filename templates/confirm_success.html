{% extends "base.html" %}
{% block title %}Details Submitted{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width: 520px; text-align: center;">
    <div class="card fade-in" style="padding: 48px 32px;">
      <div class="card-icon" style="margin: 0 auto 20px; background: #D1FAE5; color: #065F46;">✓</div>
      <h2>You're all set</h2>
      <p class="text-muted mt-2">
        Machine details and downpayment information have been received.
        Our team will review and confirm your appointment shortly.
      </p>
      <p class="text-muted" style="font-size: 0.85rem; margin-top: 16px;">
        Reference: <strong>{{ booking_id }}</strong>
      </p>
      <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Back to Home</a>
    </div>
  </div>
</section>
{% endblock %}
